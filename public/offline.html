<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Autofauna</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Roboto, verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #008c4b 0%, #637271 67%, #2c4944 100%);
      color: white;
      padding: 2rem;
      text-align: center;
    }

    .offline-container {
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 3rem 2rem;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 1rem;
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }

    .retry-button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #004D40;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-family: Roboto, verdana, sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-button:hover {
      background: #00362d;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection.</p>
    <p>Please check your connection and try again.</p>
    <button class="retry-button" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
